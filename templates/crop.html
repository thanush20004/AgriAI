<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Crop Advisory System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            background-image: linear-gradient(to bottom, #E8F5E9, #C8E6C9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            padding: 3rem;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            animation: fadeIn 1s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #1A531B;
            font-weight: 700;
        }

        .card {
            background-color: #FAFFF8;
            border-radius: 18px;
            padding: 2rem;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            border: 1px solid #E0F2F1;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background: linear-gradient(to right, #4CAF50, #66BB6A);
            color: white;
            padding: 0.85rem 1.8rem;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .result-card {
            background: linear-gradient(to right, #E8F5E9, #F0F9F1);
            border-radius: 18px;
            padding: 2rem;
            border: 2px solid #81C784;
            animation: slideIn 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .details-section {
            animation: fadeIn 0.5s ease-out;
        }

        .detail-section-card {
            background-color: #F8F9FA;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid #E0E0E0;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }
            .grid-cols-2, .grid-cols-3 {
                grid-template-columns: repeat(1, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center p-8">

    <div class="container mx-auto p-10 rounded-3xl shadow-xl flex flex-col gap-8">
        <header class="text-center">
            <h1 class="text-4xl font-bold text-green-800 flex items-center justify-center gap-4 mb-2">

                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 010 5.292m0 0a4 4 0 000 5.292m0 0a4 4 0 010 5.292M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-green-800">Crop Advisor</span>
            </h1>
            <p class="text-gray-600 text-lg">Your personalized guide to successful farming.</p>
        </header>

        <main class="flex flex-col gap-6">
            <form id="advisory-form" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label for="soil-type" class="block text-sm font-medium text-gray-700 mb-1">Soil Type</label>
                        <select id="soil-type" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-300 ease-in-out bg-white" required>
                            <option value="">Select soil type...</option>
                            <option value="loamy">Loamy</option>
                            <option value="sandy">Sandy</option>
                            <option value="clay">Clay</option>
                            <option value="silty">Silty</option>
                        </select>
                    </div>

                    <div>
                        <label for="season" class="block text-sm font-medium text-gray-700 mb-1">Season</label>
                        <select id="season" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-300 ease-in-out bg-white" required>
                            <option value="">Select season...</option>
                            <option value="rabi">Rabi (Winter)</option>
                            <option value="kharif">Kharif (Monsoon)</option>
                            <option value="summer">Summer</option>
                        </select>
                    </div>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label for="temperature" class="block text-sm font-medium text-gray-700 mb-1">Average Temperature (°C)</label>
                        <input type="number" id="temperature" placeholder="e.g., 25" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-300 ease-in-out bg-white" required>
                    </div>

                    <div>
                        <label for="rainfall" class="block text-sm font-medium text-gray-700 mb-1">Annual Rainfall (mm)</label>
                        <input type="number" id="rainfall" placeholder="e.g., 800" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-300 ease-in-out bg-white" required>
                    </div>
                </div>

                <button type="submit" class="w-full text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-lg px-5 py-3 text-center transition duration-300 ease-in-out shadow-lg">
                    Get Crop Suggestions
                </button>
            </form>

            <div id="results" class="hidden">
                <h2 class="text-2xl font-semibold text-green-700 mb-4">Recommended Crops:</h2>
                <div id="crop-suggestions" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Crop cards will be dynamically inserted here -->
                </div>
                <div id="no-results-message" class="hidden text-center mt-4 p-4 bg-red-100 text-red-700 rounded-lg">
                    <p class="font-medium">No crops found for the given conditions. Try adjusting your inputs!</p>
                </div>
            </div>
            
            <div id="details-section" class="hidden details-section">
                <button id="back-button" class="flex items-center text-green-600 hover:text-green-800 transition-colors mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Back to Suggestions
                </button>
                <div id="crop-detail-content" class="bg-white p-8 rounded-xl shadow-lg">
                    <!-- Detailed crop info will be dynamically inserted here -->
                </div>
            </div>
        </main>
    </div>

            // Function to create a crop suggestion card
            function createCropCard(crop) {
                const card = document.createElement('div');
                card.classList.add('card', 'p-6', 'rounded-xl', 'shadow-md', 'flex', 'flex-col', 'items-center', 'text-center', 'transition', 'transform', 'hover:scale-105');
                card.setAttribute('data-crop-name', crop.crop);
                
                const icon = document.createElement('div');
                icon.classList.add('text-4xl', 'mb-2');
                icon.innerHTML = cropIcons[crop.crop] || "🌱"; // Fallback icon

                const name = document.createElement('h3');
                name.classList.add('text-xl', 'font-semibold', 'text-green-800', 'mb-2');
                name.textContent = crop.crop;

                const description = document.createElement('p');
                description.classList.add('text-sm', 'text-gray-600');
                description.textContent = cropDetails[crop.crop].description || "No description available."; // Fallback description

                card.appendChild(icon);
                card.appendChild(name);
                card.appendChild(description);
                
                card.addEventListener('click', () => showCropDetails(crop.crop));
                
                return card;
            }

                            <h3 class="text-xl font-semibold text-green-700 mb-4 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2-3 .895-3 2S10.343 20 12 20M12 8c-1.657 0-3-.895-3-2s1.343-2 3-2h0c1.657 0 3 .895 3 2s-1.343 2-3 2z" />
                                </svg>
                                Market & Economic Info
                            </h3>
                            <ul class="list-disc list-inside space-y-2 text-sm">
                                <li><span class="font-medium">Market Trends:</span> ${details.market}</li>
                                <li><span class="font-medium">Storage:</span> ${details.storage}</li>
                                <li><span class="font-medium">Value Addition:</span> ${details.value_addition}</li>
                            </ul>
                        </div>
                    </div>
                `;
                
                resultsSection.classList.add('hidden');
                detailsSection.classList.remove('hidden');
            }

            // Handle form submission
            form.addEventListener('submit', (e) => {
                e.preventDefault();

                // Get user inputs
                const soilType = document.getElementById('soil-type').value;
                const season = document.getElementById('season').value;
                const temperature = parseFloat(document.getElementById('temperature').value);
                const rainfall = parseFloat(document.getElementById('rainfall').value);

                // Filter crops based on rules
                const matchingCrops = cropData.filter(crop => {
                    // Convert user input and crop data to lowercase for reliable comparison
                    const userSoilType = soilType.toLowerCase();
                    const userSeason = season.toLowerCase();

                    const soilMatch = crop.soil.map(s => s.toLowerCase()).includes(userSoilType);
                    const seasonMatch = (crop.season.toLowerCase() === userSeason || crop.season.toLowerCase() === 'year-round' || (crop.season.toLowerCase() === 'winter' && userSeason === 'rabi'));
                    const tempMatch = (temperature >= crop.min_temp && temperature <= crop.max_temp);
                    const rainfallMatch = (rainfall >= crop.min_rain && rainfall <= crop.max_rain);

                    // All conditions must be met
                    return soilMatch && seasonMatch && tempMatch && rainfallMatch;
                });

                // Clear previous suggestions
                suggestionsContainer.innerHTML = '';
                
                // Display results
                if (matchingCrops.length > 0) {
                    noResultsMessage.classList.add('hidden');
                    resultsSection.classList.remove('hidden');
                    detailsSection.classList.add('hidden'); // Hide details if navigating back to results
                    matchingCrops.forEach(crop => {
                        const card = createCropCard(crop);
                        suggestionsContainer.appendChild(card);
                    });
                } else {
                    noResultsMessage.classList.remove('hidden');
                    resultsSection.classList.remove('hidden');
                    detailsSection.classList.add('hidden'); // Hide details if no results
                }
            });
            
            backButton.addEventListener('click', () => {
                detailsSection.classList.add('hidden');
                resultsSection.classList.remove('hidden');
            });
        });
    </script>

</body>
</html>
