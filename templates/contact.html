<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Agri Community</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .contact-container {
            max-width: 500px;
            margin: 3em auto;
            background: #fff;
            padding: 2em 2.5em;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(56,142,60,0.10);
        }
        .contact-container h2 {
            color: #388e3c;
            text-align: center;
            margin-bottom: 1em;
        }
        .contact-container label {
            display: block;
            margin-bottom: 0.7em;
            color: #333;
        }
        .contact-container input,
        .contact-container textarea {
            width: 100%;
            padding: 0.5em;
            margin-top: 0.2em;
            margin-bottom: 0.8em;
            border: 1px solid #c8e6c9;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .contact-container button {
            width: 100%;
        }
        .contact-success {
            color: #388e3c;
            text-align: center;
            margin-bottom: 1em;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">Agri Community</div>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/feed/">Feed</a>
            <a href="/groups/">Groups</a>
            <a href="/contact/">Contact Us</a>
            <a href="/login/">Login</a>
            <a href="/register/">Register</a>
        </div>
    </nav>
    <div class="contact-container">
        <h2>Contact Us</h2>
        {% if success %}
            <div class="contact-success">Thank you for reaching out! We will get back to you soon.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label>Name<br><input type="text" name="name" required></label>
            <label>Email<br><input type="email" name="email" required></label>
            <label>Message<br><textarea name="message" rows="5" required></textarea></label>
            <button type="submit">Send Message</button>
        </form>
    </div>
</body>
</html>
